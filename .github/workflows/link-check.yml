name: Link Check

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/link-check.yml'
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Excluded URLs:
          # - milvus.io: Returns 302 redirect loop without cookies (bot protection)
          args: >-
            --verbose
            --no-progress
            --exclude-all-private
            --exclude 'https://milvus.io/'
            --max-retries 3
            --timeout 20
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue on Failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Link check failed';
            
            // Check if an open issue with this title already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [],
              per_page: 100
            });
            
            const issueExists = existingIssues.data.some(issue => issue.title === title);
            
            if (!issueExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: 'The scheduled link check workflow has detected broken links. Please review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
              });
            }
